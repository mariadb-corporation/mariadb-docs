<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Who runs what. With MariaDB Server, you handle everything from your schema to the hardware. With MariaDB Enterprise Platform, you still run the database, with MariaDB support behind settings, upgrades, backups, and failover. With MariaDB Cloud, the service handles backups and hardware, applies upgrades in a maintenance window you schedule, and fails over automatically when the service runs with replicas. You and the service share settings, and your schema and application stay yours.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  text { fill: #e4ecef; font: 13px Lato, "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; font-variant-ligatures: none; }
  .t { font-weight: 700; font-size: 14px; } .sm { font-size: 12px; } .xs { font-size: 11px; }
  .mut { fill: #9aabb3; } .acct { fill: #96DDCF; }
  .box { fill: #1f2a30; stroke: #3d5059; } .plain { fill: none; stroke: #3d5059; }
  .accbox { fill: #1d3533; stroke: #96DDCF; } .frame { fill: none; stroke: #9aabb3; stroke-dasharray: 5 4; }
  .ln { fill: none; stroke: #e4ecef; stroke-width: 1.4; } .dash { stroke-dasharray: 5 4; }
  .acc { stroke: #96DDCF; stroke-width: 2; } .mut-ln { stroke: #9aabb3; }
  .fillacc { fill: #96DDCF; } .fillsoft { fill: #1d3533; } .fillpanel { fill: #1f2a30; }
  .halo { paint-order: stroke; stroke: #1b1f22; stroke-width: 4px; stroke-linejoin: round; }
  .on { fill: #0f1a1c; } .cmd { font-size: 10.5px; font-variant-ligatures: none; }
  .mk { fill: #e4ecef; } .mkacc { fill: #96DDCF; }
</style>
<text class="t" x="330" y="34" text-anchor="middle">MariaDB Server</text>
<text class="t" x="500" y="34" text-anchor="middle">MariaDB Platform</text>
<text class="t" x="670" y="34" text-anchor="middle">MariaDB Cloud</text>
<text class="xs mut" x="330" y="50" text-anchor="middle">you run it</text>
<text class="xs mut" x="500" y="50" text-anchor="middle">you run it, MariaDB supports it</text>
<text class="xs mut" x="670" y="50" text-anchor="middle">the service runs it</text>
<text class="sm" x="20" y="88">Your schema, SQL, and app</text>
<rect class="box" x="250" y="66" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="87" text-anchor="middle">You</text>
<rect class="box" x="420" y="66" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="87" text-anchor="middle">You</text>
<rect class="box" x="590" y="66" width="160" height="32" rx="5"/>
<text class="sm" x="670" y="87" text-anchor="middle">You</text>
<text class="sm" x="20" y="128">Server settings and tuning</text>
<rect class="box" x="250" y="106" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="127" text-anchor="middle">You</text>
<rect class="accbox" x="420" y="106" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="127" text-anchor="middle">You, with support</text>
<rect class="accbox" x="590" y="106" width="160" height="32" rx="5"/>
<text class="sm" x="670" y="127" text-anchor="middle">You and the service</text>
<text class="sm" x="20" y="168">Upgrades and patches</text>
<rect class="box" x="250" y="146" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="167" text-anchor="middle">You</text>
<rect class="accbox" x="420" y="146" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="167" text-anchor="middle">You, with support</text>
<rect class="fillacc" x="590" y="146" width="160" height="32" rx="5"/>
<text class="sm on" x="670" y="167" text-anchor="middle">Service, in your window</text>
<text class="sm" x="20" y="208">Backups</text>
<rect class="box" x="250" y="186" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="207" text-anchor="middle">You</text>
<rect class="accbox" x="420" y="186" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="207" text-anchor="middle">You, with support</text>
<rect class="fillacc" x="590" y="186" width="160" height="32" rx="5"/>
<text class="sm on" x="670" y="207" text-anchor="middle">The service</text>
<text class="sm" x="20" y="248">Failover</text>
<rect class="box" x="250" y="226" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="247" text-anchor="middle">You</text>
<rect class="accbox" x="420" y="226" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="247" text-anchor="middle">You, with support</text>
<rect class="fillacc" x="590" y="226" width="160" height="32" rx="5"/>
<text class="sm on" x="670" y="247" text-anchor="middle">Service, with replicas</text>
<text class="sm" x="20" y="288">Hardware and OS</text>
<rect class="box" x="250" y="266" width="160" height="32" rx="5"/>
<text class="sm" x="330" y="287" text-anchor="middle">You</text>
<rect class="box" x="420" y="266" width="160" height="32" rx="5"/>
<text class="sm" x="500" y="287" text-anchor="middle">You</text>
<rect class="fillacc" x="590" y="266" width="160" height="32" rx="5"/>
<text class="sm on" x="670" y="287" text-anchor="middle">The service</text>
</svg>
