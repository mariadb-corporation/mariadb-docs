# GridGain outbound links — screened, pending decision D3
#
# WHAT THIS IS
#   Every link to gridgain.com that used to exist in the Control Center pages was
#   de-linked on 2026-09-14 and now renders as plain text on the site.
#   This file is the complete record of what was removed, so the links can be
#   restored or rewritten in bulk once we decide where they should point.
#
# WHY
#   These pages were migrated from GridGain's own docs, where linking to
#   gridgain.com was correct. In the MariaDB docs they are outbound links to
#   another vendor's site, which a draft reviewer flagged. Rather than guess a
#   destination, the links were suppressed and recorded here.
#
# HOW TO USE IT (later session)
#   1. Read the decision in the migration plan (open decision D3) for what each
#      URL class should become.
#   2. For each entry: open `file`, find the text in `after` (it is the line as it
#      now reads, with the link already flattened to `label`), and re-wrap `label`
#      as a link to the agreed destination.
#      `line` is the line number at screening time and WILL have drifted -- match
#      on `after`, not on `line`.
#   3. Labels are not unique within a file; use `after` to disambiguate.
#   4. Delete this file once every entry is resolved.
#
# CAUTION
#   129 links were screened and 46 of them had labels that carry no meaning
#   without the link -- "this article" (11x), "this", "this section",
#   "documentation", "type", "zone", "state". Those sentences currently tell the
#   reader to see something they cannot reach. They are the ones to fix first.
#
# SCOPE
#   URLs inside fenced code blocks were deliberately NOT touched (Maven repo URLs,
#   config samples). Cross-space app.gitbook.com links were not touched either.
#
