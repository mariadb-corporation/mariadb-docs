zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 748ad4d098d447d492bb935c907f652f
      name: Templates/Databases
  templates:
    - uuid: d514276c3d374af8a90bab74953f8fc6
      template: 'GridGain9 by JMX'
      name: 'GridGain9 by JMX'
      description: |
        Supported version: 9.1.13
        
        The template to monitor GridGain9, In-Memory Computing Platform, by GridGain that work without any external scripts.
          It works with both standalone and cluster instances.
          The metrics are discoverable and collected by JMX.
        
          You can set {$GRIDGAIN.USER} and {$GRIDGAIN.PASSWORD} macros in the template for using on the host level.
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback/
      groups:
        - name: Templates/Databases
      discovery_rules:
        - uuid: c56b7856341c451788e5a91ea29bdd87
          name: 'storage metrics'
          type: JMX
          key: 'jmx.discovery[beans,"org.apache.ignite:group=storage,name=*,*"]'
          delay: 6h
          username: '{$GRIDGAIN.USER}'
          password: '{$GRIDGAIN.PASSWORD}'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 7713f5bb2b1841b980bb235cabc48072
              name: CpEvictedPages
              type: JMX
              key: 'jmx["{#JMXOBJ}",CpEvictedPages]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of evicted pages in the current checkpoint.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 71783964cb034184bc732ed09be02379
              name: CpSyncedPages
              type: JMX
              key: 'jmx["{#JMXOBJ}",CpSyncedPages]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of fsynced pages in the current checkpoint.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: fb14a965e9da4e80b702cce845abff07
              name: CpTotalPages
              type: JMX
              key: 'jmx["{#JMXOBJ}",CpTotalPages]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of pages in the current checkpoint.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: cd60be5261964cb6b4fe441114944ef3
              name: CpWriteSpeed
              type: JMX
              key: 'jmx["{#JMXOBJ}",CpWriteSpeed]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Checkpoint write speed, in pages per second. Value is averaged over the last 3 checkpoints plus the current one.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: a5b96dccedbe4dfbb48da2f171afae66
              name: CpWrittenPages
              type: JMX
              key: 'jmx["{#JMXOBJ}",CpWrittenPages]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of written pages in the current checkpoint.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 57250f8e70b8420985448ab0f728b48d
              name: CurrDirtyRatio
              type: JMX
              key: 'jmx["{#JMXOBJ}",CurrDirtyRatio]'
              value_type: FLOAT
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Current ratio of dirty pages (dirty vs total), expressed as a fraction. The fraction is computed for each segment in the current region, and the highest value becomes "current."'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: c96e489bffe7472d9264c66fdb71cdc9
              name: LastCheckpointBeforeLockDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointBeforeLockDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time spent on pre-lock operations before the last checkpoint (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 4bbe282b07fe49588938278a7e4665e0
              name: LastCheckpointDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Total duration of the last checkpoint (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 3796798ad2e449f8bed8b0364750a32e
              name: LastCheckpointFsyncDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointFsyncDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time spent syncing data to disk during the last checkpoint (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 7981d809aeec418cbeb472ec1c125a09
              name: LastCheckpointLockHoldDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointLockHoldDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time the checkpoint lock was held (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 89110a5e7e6c44a79cc856cf4e25a250
              name: LastCheckpointLockWaitDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointLockWaitDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time spent waiting to acquire the checkpoint lock (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 96066c466be649bbbd95e2482878012b
              name: LastCheckpointPagesWriteDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointPagesWriteDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Duration of the page write phase (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: b7068870d23d4622bf90698df721a682
              name: LastCheckpointReplicatorLogSyncDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointReplicatorLogSyncDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time spent syncing the replicator log (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 1b4f835db957489ab1a36f002fc9f9de
              name: LastCheckpointSplitAndSortPagesDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointSplitAndSortPagesDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Duration of the split-and-sort dirty pages phase (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 497f54679b6a46b799021a0d88cf544b
              name: LastCheckpointTotalPagesNumber
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointTotalPagesNumber]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Total number of pages written during the last checkpoint.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 2b3ec47b41794a4ebac1f9eaa3988b5b
              name: LastCheckpointWaitPageReplacementDuration
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastCheckpointWaitPageReplacementDuration]'
              units: ms
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Time spent waiting for page replacement (ms).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 3cb9c3d4524d4b58925af19245f9e711
              name: LastEstimatedSpeedForMarkAll
              type: JMX
              key: 'jmx["{#JMXOBJ}",LastEstimatedSpeedForMarkAll]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Last estimated speed of marking all clean pages dirty to the end of a checkpoint, in pages/second.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: dc8869d9a25f4fb592a25dafd5985c74
              name: MarkDirtySpeed
              type: JMX
              key: 'jmx["{#JMXOBJ}",MarkDirtySpeed]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Speed of marking pages dirty, in pages/second. Value is averaged over the last 3 fragments, 0.25 sec each, plus the current fragment, 0-0.25 sec (0.75-1.0 sec total).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 03308e991a244cf5ac8977c3175a17d6
              name: MaxSize
              type: JMX
              key: 'jmx["{#JMXOBJ}",MaxSize]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Maximum in-memory region size in bytes.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: c95ae416e63541fdb98f89111f0bbe46
              name: PagesRead
              type: JMX
              key: 'jmx["{#JMXOBJ}",PagesRead]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of pages read from disk since the last restart.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: dcdc24c17ec448f8b60b3063d633024e
              name: PagesWritten
              type: JMX
              key: 'jmx["{#JMXOBJ}",PagesWritten]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of pages written to disk since the last restart.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 23bb4061dceb4a01bec32b4f42765be8
              name: SpeedBasedThrottlingPercentage
              type: JMX
              key: 'jmx["{#JMXOBJ}",SpeedBasedThrottlingPercentage]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Fraction of throttling time within average marking time (e.g., "quarter" = 0.25).'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 484b42383ee148f3be3526b164c3a698
              name: TargetDirtyRatio
              type: JMX
              key: 'jmx["{#JMXOBJ}",TargetDirtyRatio]'
              value_type: FLOAT
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Ratio of dirty pages (dirty vs total), expressed as a fraction. Throttling starts when this ratio is reached.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: a9896e12c94f4dca9a655456d09b3812
              name: ThrottleParkTime
              type: JMX
              key: 'jmx["{#JMXOBJ}",ThrottleParkTime]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Park (sleep) time for the Write operation, in nanoseconds. Value is averaged over the last 3 fragments, 0.25 sec each, plus the current fragment, 0-0.25 sec (0.75-1.0 sec total). It defines park periods for either the checkpoint buffer protection or the clean page pool protection.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: 9f66b02c1a524ab087e2c8de3ebe44af
              name: TotalAllocatedSize
              type: JMX
              key: 'jmx["{#JMXOBJ}",TotalAllocatedSize]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Total size of allocated pages on disk in bytes.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
            - uuid: e45b843b8be44a55ae36b1e288b23e10
              name: TotalUsedSize
              type: JMX
              key: 'jmx["{#JMXOBJ}",TotalUsedSize]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Total size of non-empty allocated pages on disk in bytes.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: storage
                - tag: engine
                  value: '{#JMXNAME}'
          jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  for (var item, i = 0; item = data.data[i++];) {
                      if (!('{#JMXIGNITEINSTANCENAME}' in item)) {
                          Object.assign(item, {
                              '{#JMXIGNITEINSTANCENAME}': 'null'
                          });
                      }
                  
                  }
                  
                  return JSON.stringify(data)
        - uuid: a4da45543b8e4579b6cba165c20aa378
          name: 'topology metrics'
          type: JMX
          key: 'jmx.discovery[beans,"org.apache.ignite:group=topology,name=*,*"]'
          delay: 6h
          username: '{$GRIDGAIN.USER}'
          password: '{$GRIDGAIN.PASSWORD}'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 5ba5d70d4ef74497bc4ccab7d8a4cbb4
              name: ClusterId
              type: JMX
              key: 'jmx["{#JMXOBJ}",ClusterId]'
              value_type: CHAR
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Unique identifier of the cluster.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
            - uuid: bb654c31086a4b7692ca7b0e164de98b
              name: ClusterName
              type: JMX
              key: 'jmx["{#JMXOBJ}",ClusterName]'
              value_type: CHAR
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Unique name of the cluster.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
            - uuid: 686241d825b44f7889895b990de238fc
              name: NodeId
              type: JMX
              key: 'jmx["{#JMXOBJ}",NodeId]'
              value_type: CHAR
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Unique id of the node.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
            - uuid: 3f10417bc0fb4b83b0c582300f4a1e58
              name: NodeName
              type: JMX
              key: 'jmx["{#JMXOBJ}",NodeName]'
              value_type: CHAR
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Unique name of the node.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
            - uuid: 99c679cc8e3c49d795bd2a1bf6858c1c
              name: NodeVersion
              type: JMX
              key: 'jmx["{#JMXOBJ}",NodeVersion]'
              value_type: CHAR
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'GridGain version on the node.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
            - uuid: 64a91a2a64cc48309b61f9db466a010c
              name: TotalNodes
              type: JMX
              key: 'jmx["{#JMXOBJ}",TotalNodes]'
              trends: '0'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Number of nodes in the logical topology.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: topology
                - tag: level
                  value: '{#JMXNAME}'
          jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  for (var item, i = 0; item = data.data[i++];) {
                      if (!('{#JMXIGNITEINSTANCENAME}' in item)) {
                          Object.assign(item, {
                              '{#JMXIGNITEINSTANCENAME}': 'null'
                          });
                      }
                  
                  }
                  
                  return JSON.stringify(data)
        - uuid: aaffc844319042429ad8b2147ab6ab5f
          name: 'zones metrics'
          type: JMX
          key: 'jmx.discovery[beans,"org.apache.ignite:group=zones,name=*,*"]'
          delay: 6h
          username: '{$GRIDGAIN.USER}'
          password: '{$GRIDGAIN.PASSWORD}'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 5a15f610d9cd4a7cb4472717dbbedbff
              name: LocalUnrebalancedPartitionsCount
              type: JMX
              key: 'jmx["{#JMXOBJ}",LocalUnrebalancedPartitionsCount]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'The number of partitions that should be moved to this node.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: zones
                - tag: zone
                  value: '{#JMXNAME}'
            - uuid: 4a73cdfeb21442bb851ef4c6a64dfcb8
              name: TotalUnrebalancedPartitionsCount
              type: JMX
              key: 'jmx["{#JMXOBJ}",TotalUnrebalancedPartitionsCount]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'The total number of partitions that should be moved to a new owner.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: zones
                - tag: zone
                  value: '{#JMXNAME}'
          jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  for (var item, i = 0; item = data.data[i++];) {
                      if (!('{#JMXIGNITEINSTANCENAME}' in item)) {
                          Object.assign(item, {
                              '{#JMXIGNITEINSTANCENAME}': 'null'
                          });
                      }
                  
                  }
                  
                  return JSON.stringify(data)
        - uuid: 84dc227a685f49379a80106d2825da08
          name: 'thread.pools metrics'
          type: JMX
          key: 'jmx.discovery[beans,"org.apache.ignite:group=\"thread.pools\",name=*,*"]'
          delay: 6h
          username: '{$GRIDGAIN.USER}'
          password: '{$GRIDGAIN.PASSWORD}'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 74d5fbe43b2741eea8c60364c682715f
              name: ActiveCount
              type: JMX
              key: 'jmx["{#JMXOBJ}",ActiveCount]'
              username: '{$GRIDGAIN.USER}'
              password: '{$GRIDGAIN.PASSWORD}'
              description: 'Approximate number of threads that are actively executing tasks.'
              jmx_endpoint: 'service:jmx:rmi:///jndi/rmi://{HOST.CONN}:{HOST.PORT}/jmxrmi'
              tags:
                - tag: component
                  value: thread.pools
