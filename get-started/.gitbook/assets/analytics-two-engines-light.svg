<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-label="One database, two storage engines. The products table uses InnoDB, which stores whole rows together, so a checkout reads one complete row. The sales table uses a columnar engine, which stores each column apart, so a revenue report reads only the product_id, quantity, and price columns. One SELECT joins both tables.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
  text { fill: #18181b; font: 13px Lato, "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; font-variant-ligatures: none; }
  .t { font-weight: 700; font-size: 14px; } .sm { font-size: 12px; } .xs { font-size: 11px; }
  .mut { fill: #5f5f69; } .acct { fill: #8328ED; }
  .box { fill: #f4f4f5; stroke: #c4c4cc; } .plain { fill: none; stroke: #c4c4cc; }
  .accbox { fill: #f1e8fe; stroke: #8328ED; } .frame { fill: none; stroke: #5f5f69; stroke-dasharray: 5 4; }
  .ln { fill: none; stroke: #18181b; stroke-width: 1.4; } .dash { stroke-dasharray: 5 4; }
  .acc { stroke: #8328ED; stroke-width: 2; } .mut-ln { stroke: #5f5f69; }
  .fillacc { fill: #8328ED; } .fillsoft { fill: #f1e8fe; } .fillpanel { fill: #f4f4f5; }
  .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
  .on { fill: #ffffff; } .cmd { font-size: 10.5px; font-variant-ligatures: none; }
  .mk { fill: #18181b; } .mkacc { fill: #8328ED; }
</style>

<rect class="frame" x="16" y="12" width="728" height="330" rx="8"/>
<text class="t" x="380" y="36" text-anchor="middle">One database: shop</text>
<text class="t" x="179" y="62" text-anchor="middle">products  ·  InnoDB</text>
<text class="sm" x="179" y="82" text-anchor="middle">Rows stored together.</text>
<text class="xs mut" x="179" y="98" text-anchor="middle">A checkout reads one whole row.</text>
<text class="t" x="557" y="62" text-anchor="middle">sales  ·  a columnar engine</text>
<text class="sm" x="557" y="82" text-anchor="middle">Columns stored apart.</text>
<text class="xs mut" x="557" y="98" text-anchor="middle">A report reads three columns of every row.</text>
<text class="mono xs mut" x="63" y="122" text-anchor="middle">id</text><text class="mono xs mut" x="121" y="122" text-anchor="middle">name</text><text class="mono xs mut" x="179" y="122" text-anchor="middle">price</text><text class="mono xs mut" x="237" y="122" text-anchor="middle">stock</text><text class="mono xs mut" x="295" y="122" text-anchor="middle">...</text><text class="mono xs mut" x="417" y="122" text-anchor="middle">sale_id</text><text class="mono xs acct" x="487" y="122" text-anchor="middle" font-weight="700">product_id</text><text class="mono xs mut" x="557" y="122" text-anchor="middle">sale_date</text><text class="mono xs acct" x="627" y="122" text-anchor="middle" font-weight="700">quantity</text><text class="mono xs acct" x="697" y="122" text-anchor="middle" font-weight="700">price</text>
