name: Nightly Post Download sweep

# Reports release notes pages that reached main without their Post Download page. See DOCS-6882.
#
# WHY THIS IS NOT REDUNDANT WITH postdownload-pr.yml
#   That workflow's new-page gate (DOCS-6408) is blocking on a PR from our own branches but only
#   ADVISORY on a fork PR: platform pages are docs-team work, and nobody can push to a fork branch
#   to add them for the contributor. So a fork PR merged without anyone acting on its warning ships
#   the same gap DOCS-6376 and DOCS-6405 did, and nothing reported it after merge. Neither does a
#   pull_request trigger see the write paths that never open a PR -- GitBook-UI edits syncing back
#   as GITBOOK-* commits, and commits pushed straight to main. The PR workflow covers PRs and this
#   covers the tree, the same split as fragcheck-pr.yml and nightly-fragcheck.yml.
#
# ONE CODE PATH: this runs `postdownload.py new <base> --advisory`, the PR gate's own invocation,
# so it inherits the naming map, the `no-standalone:` register, and every exemption without a
# second copy. --advisory only rewords the findings for the docs team; the exit code is the same.
#
# WHY A FIXED BASELINE AND NOT A ROLLING ONE
#   The other nightly digests diff against a rolling 24-hour base, so each finding is reported on
#   the night it lands and never again. That is right for them and wrong here: the gap this closes
#   is precisely a warning that was shown once and ignored, and a digest that also speaks once
#   would rebuild it. So the base is pinned at the commit where the DOCS-6408 gate landed, and a
#   finding repeats every weekday until someone adds the page, its platform/SUMMARY.md entry, or a
#   `no-standalone:` register entry.
#
#   That does not trip the warning in nightly-unlabeled-prs.yml about a daily identical message:
#   the standing set was zero when this was written, the releases that predate the gate (68 with
#   no Post Download page and no register entry, counted 2026-10-13) stay behind the baseline
#   exactly as they do for the PR gate, and every finding is a page owed for a release that is
#   already published, which takes minutes to clear. Triaging those 68 is a separate cleanup.
#
#   The baseline is a pinned SHA rather than a tag: it is self-documenting here, and nothing has to
#   keep a tag from moving. If history is ever rewritten, the resolve step fails red rather than
#   letting the scan SKIP.
#
# REPORT, DON'T WRITE: this files nothing and pushes nothing. Writing a Post Download page needs a
# person, and so does deciding that a release has no standalone package.
#
# The rest -- the Monday heartbeat, the jq payload and its mrkdwn escaping, errors: true, the
# failure notice -- is the same design as nightly-fragcheck.yml, whose header explains each choice.
# Keep them in step.

on:
  workflow_dispatch:
    inputs:
      always_post:
        description: 'Post to Slack even when nothing is owed'
        required: false
        default: false
        type: boolean
      base_rev:
        description: 'Override the fixed baseline (a sha or anything git rev-parse accepts)'
        required: false
        default: ''
        type: string
  # 06:40 UTC, five minutes after the GitBook-edit digest so the two do not arrive in the channel
  # as one indistinguishable block. Weekends are skipped: a Saturday digest reaches nobody, and a
  # finding still owed on Monday is reported then.
  #
  # Split into two entries rather than one '40 6 * * 1-5' so the steps can tell Monday apart:
  # github.event.schedule carries the cron string verbatim, which is only useful as a
  # discriminator if Monday has its own line.
  schedule:
    # Tue-Fri: speaks only when a page is owed.
    - cron: '40 6 * * 2-5'
    # Monday: also speaks when nothing is owed, as the weekly heartbeat.
    - cron: '40 6 * * 1'

permissions:
  contents: read

concurrency:
  group: nightly-postdownload
  cancel-in-progress: false

env:
  # The tip of DOCS-6408 (PR #1187) on main, 2026-10-06: the first commit at which
  # postdownload-pr.yml gated new release notes pages. Pages absent here are the ones the gate
  # was responsible for.
  BASELINE: f126408fcf1f3fa7c88fabf48afbb34aee2959f2

jobs:
  digest:
    # Upstream only: forks must not open bot PRs, post to Slack or publish (DOCS-6934).
    if: github.repository == 'mariadb-corporation/mariadb-docs'
    runs-on: ubuntu-latest
    # One git ls-files, one ls-tree and a stat per new page -- seconds. Without this the job
    # inherits the 6-hour default, so a wedged git call burns six hours of runner time and then
    # ends as *cancelled* -- which `if: failure()` does not catch, so nobody would hear about it.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # REQUIRED: `new` reads the baseline's tree out of the object store, and when the
          # baseline is missing it prints SKIPPED and returns ZERO. On a shallow clone this digest
          # would report "nothing owed" every night forever. The resolve step below turns that
          # into a red run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Standard library only; this pins the interpreter, it installs nothing.
          python-version: '3.12'

      - name: Resolve the baseline revision
        id: base
        env:
          BASE_OVERRIDE: ${{ inputs.base_rev }}
        run: |
          set -euo pipefail

          # A hand-supplied revision is resolved rather than trusted, so a typo fails here with a
          # clear message instead of becoming a SKIP.
          want="${BASE_OVERRIDE:-$BASELINE}"
          base=$(git rev-parse --verify "${want}^{commit}" 2>/dev/null || true)
          if [[ -z "$base" ]]; then
            echo "::error::Base revision '${want}' does not resolve to a commit in this clone."
            exit 1
          fi

          # rev-parse succeeds on a well-formed sha that is absent from the object database.
          # Same assertion as nightly-fragcheck.yml.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Base commit ${base} is not in this clone, so the scan would SKIP and report success."
            exit 1
          fi

          {
            echo "sha=$base"
            echo "short=$(git rev-parse --short "$base")"
            echo "date=$(git log -1 --format=%cI "$base")"
          } >> "$GITHUB_OUTPUT"

      - name: Scan for release notes pages without a Post Download page
        id: scan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -uo pipefail
          set +e
          python3 .claude/hooks/postdownload.py new "$BASE_SHA" --advisory > postdownload.log 2>&1
          rc=$?
          set -e
          cat postdownload.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          # A FINDING IS NOT A FAILURE HERE. This is a read-only digest, so rc 1 must leave the
          # job green -- otherwise every finding would also fire the `if: failure()` notice below
          # and the channel would get two messages for one event, one of them claiming the digest
          # is broken. rc 2 (the script rejecting its arguments or its register) and anything
          # else (a crash) ARE failures: they mean the digest did not run.
          case "$rc" in
            0|1) ;;
            2) echo "::error::postdownload.py rejected its arguments, or could not read the acknowledgment register."; exit 1 ;;
            *) echo "::error::postdownload.py exited $rc (crash). The digest did not run."; exit 1 ;;
          esac

          # postdownload.py SKIPs and exits zero for a missing platform/post-download/, an
          # unresolvable base, or a nested tree; none of those may read as "nothing owed" in a
          # checkout that must support the scan. Zero new pages is legitimate, so this asserts
          # the SKIP and the summary line, not a nonzero count. Same assertion as
          # postdownload-pr.yml.
          if grep -q 'SKIPPED' postdownload.log; then
            echo "::error::The scan SKIPPED in a checkout that must support it -- a space directory was renamed, or the baseline is missing. A clean result here would mean nothing."
            exit 1
          fi
          if ! grep -qE '^postdownload: [0-9]+ new release pages? checked vs ' postdownload.log; then
            echo "::error::Could not read the checked-page count out of postdownload's output. Either the summary line changed shape (update this assertion with it) or the script never got to print it."
            exit 1
          fi

      # The scan names pages, not how they arrived. The commit that added each one is what tells
      # a person whether it was a fork PR, a GitBook-UI edit, or a direct push -- and who to ask.
      - name: Name the commit that added each page
        if: steps.scan.outputs.rc == '1'
        run: |
          set -euo pipefail
          grep -oE 'release-notes/[^ ]+\.md' postdownload.log | sort -u | while read -r page; do
            echo "$page"
            echo "    added by $(git log -1 --diff-filter=A --format='%h %s' -- "$page")"
          done > added-by.log
          cat added-by.log

      - name: Build the Slack payload
        id: payload
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC: ${{ steps.scan.outputs.rc }}
          BASE_SHORT: ${{ steps.base.outputs.short }}
          BASE_DATE: ${{ steps.base.outputs.date }}
          # 'true' only on the Monday cron. github.event.schedule holds the cron string exactly as
          # written above, and is absent on workflow_dispatch, where the comparison yields false.
          # Renders as the literal 'true' or 'false', which --argjson reads as a boolean.
          HEARTBEAT: ${{ github.event.schedule == '40 6 * * 1' }}
        run: |
          set -euo pipefail
          touch added-by.log

          # jq builds the whole payload, so a path or commit subject containing a quote, a
          # backslash or an emoji cannot produce invalid JSON. And `esc` keeps it safe as
          # *mrkdwn*: the output embeds paths and commit subjects that anyone with a GitHub
          # account or GitBook-UI access can author, and an unescaped `<url|label>` would render
          # as a link whose visible text is not its target, delivered by a trusted bot. Same
          # reasoning, and the same deliberate decision not to escape `*`, `_` or backticks, as
          # nightly-fragcheck.yml and nightly-unlabeled-prs.yml.
          #
          # The body is truncated at 2,800 characters: Slack rejects an incoming-webhook payload
          # over 4,000 with msg_too_long, and at `errors: true` that is a red run. The step
          # summary carries the full log. The cut comes after `esc`, because escaping can grow
          # the text fivefold and only the escaped length is bounded; a cut that lands inside
          # an entity (`&am`) drops the fragment rather than leaving it at the end.
          jq -n \
            --rawfile log postdownload.log \
            --rawfile added added-by.log \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run "$RUN_URL" \
            --arg base "$BASE_SHORT" \
            --arg basedate "$BASE_DATE" \
            --argjson rc "${RC:-0}" \
            --argjson heartbeat "${HEARTBEAT:-false}" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");

            (($log + (if $added == "" then "" else "\n" + $added end)) | esc) as $body
            | (if ($body | length) > 2800
               then (($body[0:2800] | sub("&[a-z]{0,3}$"; ""))
                     + "\n… truncated; full output in the run summary.")
               else $body end) as $body
            | { text: (
                  if $rc == 0 and $heartbeat then
                    ":coffee: *Weekly check-in* — every Community Server and connector release notes page added to \($repo) since \($base) (\($basedate)) has its Post Download page."
                    + "\n\n<\($run)|workflow run>"
                  elif $rc == 0 then
                    ":white_check_mark: Every Community Server and connector release notes page added to \($repo) since \($base) has its Post Download page."
                    + "\n\n<\($run)|workflow run>"
                  else
                    ":package: *Post Download pages owed in \($repo)*\n"
                    + "```\n\($body)\n```"
                    + "\n\nA reader who finishes a download from these releases lands on no page. Add each page and its `platform/SUMMARY.md` entry, or a `no-standalone:` entry in `.claude/hooks/doc-lint-allow.yml` if the version shipped only inside a Server release. Repeats every weekday until cleared."
                    + "\n<\($run)|workflow run>"
                  end
                ) }' > payload.json

          jq -e . payload.json > /dev/null   # fail loudly rather than posting garbage

      - name: Record the result in the run summary
        # always(): the runs most worth a record are the ones that failed.
        if: always()
        env:
          RC: ${{ steps.scan.outputs.rc }}
          BASE_SHORT: ${{ steps.base.outputs.short }}
          BASE_DATE: ${{ steps.base.outputs.date }}
        run: |
          set -euo pipefail
          {
            echo "## Post Download sweep"
            echo
            if [[ ! -s postdownload.log ]]; then
              echo "No output was produced -- an earlier step failed before the scan ran."
            else
              echo "Baseline revision \`${BASE_SHORT:-?}\` (${BASE_DATE:-unknown})."
              echo
              case "${RC:-}" in
                0) echo "Every Community Server and connector release notes page added since the baseline has its Post Download page, or a register entry saying it has none." ;;
                1) echo "Release notes pages added since the baseline are missing their Post Download page or its \`platform/SUMMARY.md\` entry. Nothing was filed -- the fix stays a human decision." ;;
                *) echo "The scan did not complete (exit ${RC:-unknown})." ;;
              esac
              echo
              # Fenced with four backticks: this is a GFM rendering surface and the output embeds
              # repo paths and commit subjects, so unfenced it could forge a heading or open an
              # HTML comment. See nightly-unlabeled-prs.yml.
              echo '````text'
              cat postdownload.log
              if [[ -s added-by.log ]]; then
                echo
                cat added-by.log
              fi
              echo '````'
              echo
              echo "Run the same check locally with:"
              echo
              echo '````bash'
              echo "python3 .claude/hooks/postdownload.py new ${BASE_SHORT:-$BASELINE}"
              echo '````'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Both Slack steps post to NOTIFICATIONS_WEBHOOK_URL -- one channel for the digest and for
      # the notice that the digest broke. If that webhook is what fails, the failure notice has
      # nowhere to go either; `errors: true` still turns the run red.
      #
      # Never set `payload-templated` on either step. It defaults to false; with it on, the action
      # expands ${{ }} inside the payload against the env and github contexts, so a page named
      # ${{ env.NOTIFICATIONS_WEBHOOK_URL }} would print the webhook into the channel.
      #
      # The Monday clause is what makes the heartbeat reach Slack at all -- rc is 0 on a clean
      # Monday, so the first clause is false and without the second nothing would be sent.
      - name: Post the digest to Slack
        if: steps.scan.outputs.rc != '0' || github.event.schedule == '40 6 * * 1' || inputs.always_post
        uses: slackapi/slack-github-action@v3.0.5
        with:
          webhook: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Keep the .json extension: the action picks its parser from it.
          payload-file-path: payload.json
          # REQUIRED, not optional: with errors off, a revoked webhook, an archived channel, a
          # 429, or msg_too_long is swallowed and the step still goes green. See
          # nightly-fragcheck.yml.
          errors: true

      # A step-level failure notice: a git or python error would otherwise fail silently at 06:40
      # with nobody watching. This covers failure() only -- a cancelled run, a dropped scheduled
      # run, or a suspended cron reaches nobody. That is what the Monday heartbeat is for.
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.5
        with:
          webhook: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Post Download sweep failed*\n*Repo:* ${{ github.repository }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          errors: true
