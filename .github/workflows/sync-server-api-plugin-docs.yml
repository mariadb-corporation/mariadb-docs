# .github/workflows/sync-server-api-plugin-docs.yml
name: Sync Server generated Plugin API documentation

on:
  schedule:
    # Daily; generation is cheap compared with a full server build.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      server_ref:
        description: 'MariaDB/server branch, tag, or SHA to generate from'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write
  # The gate job below publishes its verdict as a commit status on the PR head (DOCS-6675).
  statuses: write

concurrency:
  group: sync-server-api-plugin-docs
  cancel-in-progress: false

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
      head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
    steps:
      - name: Checkout mariadb-docs
        uses: actions/checkout@v7

      - name: Checkout MariaDB/server
        uses: actions/checkout@v7
        with:
          repository: MariaDB/server
          ref: ${{ inputs.server_ref || 'main' }}
          path: .server-src
          # Generation only needs headers + the Doxygen config next to them.
          sparse-checkout: |
            include/mysql
          sparse-checkout-cone-mode: false

      - name: Record server revision
        id: server
        run: |
          set -euo pipefail
          sha=$(git -C .server-src rev-parse HEAD)
          short=$(git -C .server-src rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Server revision: $sha"

      - name: Generate Plugin API Markdown
        run: |
          set -euo pipefail
          dest="$PWD/.generated-api-plugin"
          mkdir -p "$dest"
          chmod +x .server-src/include/mysql/generate_plugin_api_docs.sh
          docker run --rm \
            --volume "$PWD/.server-src:/src:ro" \
            --volume "$dest:/out" \
            --workdir /src/include/mysql \
            --entrypoint bash \
            ghcr.io/mariadb/mariadb-doc-gen:latest \
            -euxo pipefail -c 'bash generate_plugin_api_docs.sh /out'
          # The container writes as root into the bind mount, so the runner
          # cannot delete or copy the tree afterwards without this.
          sudo chown -R "$(id -u):$(id -g)" "$dest"
          test -d "$dest/md"
          test -n "$(find "$dest/md" -name '*.md' -print -quit)"
          echo "Generated files:"
          find "$dest/md" -name '*.md' | sort

      - name: Install generated Markdown into mariadb-docs
        run: |
          set -euo pipefail
          src=".generated-api-plugin/md"
          # Full generated set (api.md plus per-group / per-page files).
          dest_dir="server/reference/plugins/api-plugin"
          # delete the dest dir so that there's no stale files
          rm -rf "$dest_dir"
          mkdir -p "$dest_dir"
          cp -a "$src"/. "$dest_dir"/
          # GitBook publishes README.md as a directory's index, so renaming the
          # generated mainpage puts the section landing page at
          # .../reference/plugins/api-plugin/ instead of .../api-plugin/page-index.
          # First test fails the step loudly if the mainpage ever stops being
          # generated; second one refuses to clobber a generated group or page
          # that happens to be titled README.
          test -f "$dest_dir/page-index.md"
          test ! -e "$dest_dir/README.md"
          mv "$dest_dir/page-index.md" "$dest_dir/README.md"
          rm -rf ".generated-api-plugin"

      - name: Flatten level 5 and 6 Markdown headers to level 4
        run: |
          set -euo pipefail
          dest_dir="server/reference/plugins/api-plugin"
          # ATX headings only: ##### and ###### at the start of a line become ####.
          # Process ###### first so a six-hash heading is not left as a five-hash
          # heading after a single pass.
          grep -rlZ '^#####' "$dest_dir" | while IFS= read -r -d '' f; do
            sed -i -E \
              -e 's/^######[[:space:]]+/#### /' \
              -e 's/^#####[[:space:]]+/#### /' \
              "$f"
          done

      - name: Drop dead page-title breadcrumb fragments
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_plugin_api_breadcrumb_links.py

      - name: Add frontmatter to the generated pages
        run: |
          set -euo pipefail
          bash .github/scripts/add_frontmatter_to_server_plugin_api.sh

      - name: Update Plugin API Documentation section in SUMMARY.md
        run: |
          set -euo pipefail
          bash .github/scripts/add_server_plugin_api_to_summary.sh

      - name: Open a pull request if the generated docs changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/sync-server-api-plugin-docs
          base: main
          delete-branch: true
          add-paths: |
            server/reference/plugins/api-plugin/**
            server/SUMMARY.md
          title: Generated Plugin API documentation from MariaDB/server update to ${{ steps.server.outputs.short }}
          commit-message: |
            Sync generated Plugin API documentation from MariaDB/server

            Generated by doxygen+moxygen from MariaDB/server@${{ steps.server.outputs.sha }}.
          body: |
            It's generated by doxygen+moxygen from the server's main branch.

            Source: [`MariaDB/server@${{ steps.server.outputs.short }}`](https://github.com/MariaDB/server/commit/${{ steps.server.outputs.sha }})

            This updates:
            - `server/reference/plugins/api-plugin/` (full generated `.md` directory)
            - `server/SUMMARY.md` (Plugin API Documentation section)

            Automated by `.github/workflows/sync-server-api-plugin-docs.yml`. Review the diff and merge if the API docs look right.
          labels: |
            automated
            documentation

  # WHY THIS JOB EXISTS  (DOCS-6675)
  #   The PR the job above opens is authored by GITHUB_TOKEN, and GitHub fires no
  #   `on: pull_request` workflows for such a PR -- so codespell, link-check, fragcheck and
  #   includecheck all sit out, and only the GitBook space checks run. DOCS-6618 is what that
  #   cost: PR #1052 merged 344 dead in-page anchors and 14 pages with no frontmatter, and the
  #   ticket was filed in place of a red check. This runs the same gates against the pushed
  #   branch and posts the verdict as a commit status on the PR head, where a reviewer sees it.
  #
  #   codespell is not among the gates that bear on THIS content, and correctly so: every
  #   SUMMARY.md is excluded (DOCS-6272) and server/reference/plugins/api-plugin/** is too
  #   (DOCS-6618 -- the "misspellings" are C identifiers quoted out of the server's headers,
  #   and the next generation run would revert any edit). The gates that do bear on it are
  #   fragcheck, includecheck, navcheck, the shrink guard, the retired-KB guard and lychee.
  gate:
    needs: generate-and-pr
    # Empty when the generated docs were unchanged and no PR was opened or updated.
    if: needs.generate-and-pr.outputs.pr-number != ''
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/doc-gates.yml
    with:
      branch: automated/sync-server-api-plugin-docs
      head-sha: ${{ needs.generate-and-pr.outputs.head-sha }}
      # Mirrors the add-paths above: gate exactly what the PR commits.
      pathspecs: |
        server/reference/plugins/api-plugin/**
        server/SUMMARY.md
      status-context: doc-gates
