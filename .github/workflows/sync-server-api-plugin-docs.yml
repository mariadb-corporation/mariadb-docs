# .github/workflows/sync-server-api-plugin-docs.yml
name: Sync Server generated Plugin API documentation

on:
  schedule:
    # Daily; generation is cheap compared with a full server build.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      server_ref:
        description: 'MariaDB/server branch, tag, or SHA to generate from'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-server-api-plugin-docs
  cancel-in-progress: false

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mariadb-docs
        uses: actions/checkout@v7

      - name: Checkout MariaDB/server
        uses: actions/checkout@v7
        with:
          repository: MariaDB/server
          ref: ${{ inputs.server_ref || 'main' }}
          path: .server-src
          # Generation only needs headers + the Doxygen config next to them.
          sparse-checkout: |
            include/mysql
          sparse-checkout-cone-mode: false

      - name: Record server revision
        id: server
        run: |
          set -euo pipefail
          sha=$(git -C .server-src rev-parse HEAD)
          short=$(git -C .server-src rev-parse --short HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Server revision: $sha"

      - name: Generate Plugin API Markdown
        run: |
          set -euo pipefail
          dest="$PWD/.generated-api-plugin"
          mkdir -p "$dest"
          docker run --rm \
            --volume "$PWD/.server-src:/src:ro" \
            --volume "$dest:/out" \
            --workdir /src/include/mysql \
            ghcr.io/mariadb/mariadb-doc-gen:latest \
            bash -euxo pipefail -c 'generate_plugin_api_docs.sh /out'
          test -d "$dest/md"
          test -n "$(find "$dest/md" -name '*.md' -print -quit)"
          echo "Generated files:"
          find "$dest/md" -name '*.md' | sort

      - name: Install generated Markdown into mariadb-docs
        run: |
          set -euo pipefail
          src=".generated-api-plugin/md"
          # Full generated set (api.md plus per-group / per-page files).
          dest_dir="server/reference/plugins/api-plugin"
          # delete the dest dir so that there's no stale files
          rm -rf "$dest_dir"
          mkdir -p "$dest_dir"
          cp -a "$src"/. "$dest_dir"/
          rm -rf ".generated-api-plugin"

      - name: Update Plugin API Documentation section in SUMMARY.md
        run: |
          set -euo pipefail
          .github/scripts/add_server_plugin_api_to_summary.sh

      - name: Open a pull request if the generated docs changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/sync-server-api-plugin-docs
          base: main
          delete-branch: true
          add-paths: |
            server/reference/plugins/api-plugin/**
            server/SUMMARY.md
          title: Generated Plugin API documentation from MariaDB/server update to ${{ steps.server.outputs.short }}
          commit-message: |
            Sync generated Plugin API documentation from MariaDB/server

            Generated by doxygen+moxygen from MariaDB/server@${{ steps.server.outputs.sha }}.
          body: |
            It's generated by doxygen+moxygen from the server's main branch.

            Source: [`MariaDB/server@${{ steps.server.outputs.short }}`](https://github.com/MariaDB/server/commit/${{ steps.server.outputs.sha }})

            This updates:
            - `server/reference/plugins/api-plugin/` (full generated `.md` directory)
            - `server/SUMMARY.md` (Plugin API Documentation section)

            Automated by `.github/workflows/sync-server-plugin-api-docs.yml`. Review the diff and merge if the API docs look right.
          labels: |
            api-plugin
            plugins