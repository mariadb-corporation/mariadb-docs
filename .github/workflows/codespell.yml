name: Check for common misspellings in PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codespell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        # SHA-pinned rather than tag-pinned: this action was compromised in
        # March 2025 (CVE-2025-30066), when tags in the v1-v45 range were
        # repointed at code that leaked runner secrets. Pinning the commit
        # removes the retag vector. Dependabot keeps the SHA and the comment
        # in sync. See DOCS-6362.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **.md
            **.html
          # SUMMARY.md files are excluded from spell check: GitBook truncates link
          # labels to 100 chars (often mid-word), producing false positives. Real
          # misspellings still surface in the page titles codespell checks
          # elsewhere. See DOCS-6272.
          files_ignore: |
            **/SUMMARY.md
            SUMMARY.md
            # agent-skills/topical/ is vendored verbatim from MariaDB/skills
            # (see agent-skills/topical/VENDORED.md). We don't hand-edit it, so
            # spelling fixes go upstream, not here. Our own authored skills under
            # agent-skills/granular/ stay in scope.
            agent-skills/topical/**

      - name: Scan for for common misspellings in text files
        if: steps.changes.outputs.any_changed == 'true'
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          path: ${{ steps.changes.outputs.all_changed_files }}
          ignore_words_file: .codespellignore # Ref: https://github.com/codespell-project/actions-codespell/tree/bca0a5887de255a8903221c67b6478c7501c5edc?tab=readme-ov-file#parameter-ignore_words_file

      - name: 📖 Help & Documentation
        if: failure()
        run: |
          echo "### ❌ Spell Check Failed?" >> $GITHUB_STEP_SUMMARY
          echo "👉 [**Read the SOP: How to Fix Spell Check Errors**](https://mariadbcorp.atlassian.net/wiki/spaces/DOCS/pages/3284140040/Pull+Requests#Method-1%3A-The-%22Quick-Fix%22-(Recommended))" >> $GITHUB_STEP_SUMMARY

