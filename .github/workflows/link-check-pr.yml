name: Check Links in PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        # SHA-pinned rather than tag-pinned: this action was compromised in
        # March 2025 (CVE-2025-30066), when tags in the v1-v45 range were
        # repointed at code that leaked runner secrets. Pinning the commit
        # removes the retag vector. Dependabot keeps the SHA and the comment
        # in sync. See DOCS-6362.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # JSON output preserves path boundaries. The default space-separated
          # form escapes parentheses but NOT spaces, so a filename like
          # "most-recent-12.0 (1).md" splits into two bogus inputs and lychee
          # aborts with "Cannot parse inputs from arguments" before checking
          # anything. See DOCS-6361.
          json: true
          escape_json: false
          # safe_output backslash-escapes shell metacharacters inside the JSON
          # strings, which makes the JSON itself invalid ("\(" is not a legal
          # JSON escape) and jq refuses to parse it. We do our own quoting in
          # the next step instead, and pass the JSON via env rather than
          # interpolating it into the script, so filenames cannot inject shell.
          safe_output: false
          files: |
            **.md
            **.html
          # agent-skills/topical/ is vendored verbatim from MariaDB/skills
          # (see agent-skills/topical/VENDORED.md). Link fixes go upstream, not
          # here. Our own authored skills under agent-skills/granular/ stay in scope.
          files_ignore: |
            agent-skills/topical/**

      - name: Build a shell-safe file list
        id: list
        if: steps.changes.outputs.any_changed == 'true'
        env:
          CHANGED_JSON: ${{ steps.changes.outputs.all_changed_files }}
        run: |
          # jq's @sh emits each path as a single-quoted shell token, so paths
          # containing spaces survive word splitting in the args string below.
          {
            printf 'files='
            jq -r '.[] | @sh' <<< "$CHANGED_JSON" | tr '\n' ' '
            printf '\n'
          } >> "$GITHUB_OUTPUT"

      - name: Scan for broken links
        if: steps.changes.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # ADDED: Excludes for both raw '{' and encoded '%7B'
          # Flaky/example external hosts (bottom of the list): mcs1 is a
          # placeholder hostname in ColumnStore cmapi curl samples; the rest
          # time out, rate-limit (429), or return cert errors from CI but are
          # otherwise valid links. The newest two are from DOCS-6361:
          # blogspot.com answers CI with 429, and www.poliarch.org times out
          # from the runners; both serve 200 promptly from a normal client.
          # DOCS-6369 adds two more of the same kind: www.reddit.com blocks the
          # Actions runners outright (serves 200 to a normal client), and
          # csm.mariadb.com is the customer support portal, which answers 403 to
          # anyone not logged in. Both links are valid for readers.
          # DOCS-6499 adds docs.ansible.com, same class as blogspot.com: it
          # answers the runners with 429 on every request (7 links on one page,
          # two consecutive runs) while serving 301 -> 200 to a normal client.
          # The 429 is host-level rate limiting, so replacing the URLs with
          # their resolved /projects/ansible/ form would not help.
          #
          # Note for editors: the args block below is a YAML folded scalar, so
          # a '#' line inside it is NOT a comment -- it would be passed to
          # lychee as arguments. Document new excludes up here.
          #
          # DOCS-6377: historical-reference excludes for the connector release
          # notes. bazaar.launchpad.net is the decommissioned bzr host (revision
          # links 404). The github connector /commit/ links are changelog
          # entries whose SHAs predate history rewrites, so ~5% now 404 with no
          # valid replacement. lists.askmonty.org (a mailing-list archive) and
          # support2.microsoft.com (a decommissioned Microsoft domain) are cited
          # in old changelog commit text and are unreachable with no modern
          # equivalent. All are unmaintainable historical refs, not fixable links.
          #
          # DOCS-6369: the same problem in the *server* changelogs. Those pages
          # cite one github.com/MariaDB/server/commit/<short-sha> per revision --
          # 12,278 distinct links across the release-notes tree. Sampling 250 of
          # them found 1.2% dead (~150 repo-wide): abbreviated SHAs that no
          # longer resolve after history rewrites. Same class as the connector
          # excludes above -- historical citations, not fixable links -- and they
          # only surface when a PR happens to touch a changelog page.
          #
          # DOCS-6369: decommissioned hosts cited in the pre-1.0/5.x release
          # notes. downloads.askmonty.org was the download host before the
          # rename to MariaDB; montyprogram.com was the company domain;
          # forge.mysql.com and lists.mysql.com were retired by Oracle
          # (forge now serves a cert for another host); blogs.msdn.com folded
          # into learn.microsoft.com. None have a modern equivalent to point at.
          #
          # DOCS-5976: three more hosts that block automated clients, same
          # class as www.reddit.com above. stackoverflow.com and
          # gitlab.kitware.com answer 403 at the site ROOT (not just the cited
          # page) even with a browser User-Agent, so it is a host-level block,
          # not a dead page. www.freedesktop.org is the sharper case: it serves
          # 200 to a developer machine but 418 ("I'm a teapot") to the Actions
          # runners, so a local lychee run PASSES while CI fails -- the one
          # failure mode a pre-PR check cannot reproduce. All are valid for
          # readers.
          #
          # DOCS-6446: the two cloud-marketplace listings cited in the MariaDB
          # Cloud FAQ. azuremarketplace.microsoft.com answers 403 to any
          # non-browser client, and so does the marketplace.microsoft.com host it
          # 308-redirects to, so replacing the URL with its resolved form does not
          # help. console.cloud.google.com fails differently -- "HTTP/2 protocol
          # error" rather than a status code -- because the host mishandles
          # lychee's HTTP/2 negotiation. Both serve 200 to a browser User-Agent
          # over HTTP/1.1 and are valid for readers.
          #
          # DOCS-6430 (2026-08-14): partedmagic.com, cited once in
          # general-resources/distributions-including-mariadb.md. CI reports
          # "SSL certificate expired", but the certificate is valid -- Let's
          # Encrypt, notBefore 27 Jun 2026, notAfter 25 Sep 2026, checked with
          # openssl on the day CI failed. The site also serves 200 to curl. The
          # disagreement is between the runner's trust store and the chain the
          # host presents (issuer CN=YR2), so it will not self-heal the way a
          # genuine expiry would, and there is nothing to fix on our side.
          #
          # DOCS-6385 (2026-08-17): two more of each kind, surfaced by the
          # private-repo link sweep across 396 release-notes pages.
          #
          # Historical GitHub citations, same class as the two /commit/ excludes
          # at the top of this list. The Galera changelogs cite upstream issue
          # numbers in codership/galera and codership/mysql-wsrep, whose issue
          # trackers no longer resolve; the Docker and Jupyter-kernel release
          # notes cite MariaDB/mariadb-docker and MariaDB/mariadb_kernel issues
          # that have since been deleted; and mysql/mysql-utilities and
          # Perl/perl5/issues are cited in old changelog text. All are
          # unmaintainable historical references, not fixable links -- the
          # issue numbers are the record, and there is nothing to point at.
          #
          # Live sites that block automated clients, same class as
          # www.reddit.com and stackoverflow.com above. dba.stackexchange.com
          # and askubuntu.com answer 403 to any non-browser client (Stack
          # Exchange requires JS), and www.fsf.org fails lychee's connection
          # while serving 200 to a browser User-Agent. All are valid for readers.
          #
          # DOCS-6449 (2026-08-18): three vendor/doc hosts cited from
          # server/clients-and-utilities/ that block automated clients, proven
          # alive by the challenge each one serves rather than by a status code.
          # valentina-db.com and www.sqlmaestro.com both sit behind Sucuri
          # CloudProxy and return its "Javascript is required" interstitial (403
          # and 307 respectively). docs.moodle.org answers with
          # "Cf-Mitigated: challenge" from Cloudflare. A browser User-Agent does
          # NOT get past any of the three, so there is no resolved URL to
          # substitute -- unlike codex.wordpress.org, which was retired by
          # WordPress and so got repointed at wordpress.org/documentation
          # instead of excluded.
          #
          # DOCS-6496 (2026-08-21): lists.freedesktop.org, the systemd-devel
          # mailing-list archive, cited from systemd/configuring.md and the
          # Galera SST page. Unlike every host above it is neither dead nor
          # blocking -- it is simply slow and intermittent, so it fails as a
          # TIMEOUT rather than an error, and lychee reports that alongside
          # "Errors 0" while still exiting non-zero. Both cited pages return
          # 200 with their real content on a retry (2 of 5 attempts from a
          # developer machine), and CI and a local run time out on DIFFERENT
          # URLs of the same host, which is what makes it host-level rather
          # than a rotted page. Its sibling www.freedesktop.org is already
          # excluded above. Nothing to repoint at: this archive is canonical
          # for these threads.
          args: >-
            --no-progress
            --exclude 'bazaar\.launchpad\.net'
            --exclude 'github\.com/mariadb-corporation/mariadb-connector-[a-z0-9]+/commit/'
            --exclude 'github\.com/MariaDB/server/commit/'
            --exclude 'downloads\.askmonty\.org'
            --exclude 'montyprogram\.com'
            --exclude 'forge\.mysql\.com'
            --exclude 'lists\.mysql\.com'
            --exclude 'blogs\.msdn\.com'
            --exclude 'lists\.askmonty\.org'
            --exclude 'support2\.microsoft\.com'
            --exclude dev\.mysql\.com
            --exclude docs\.oracle\.com
            --exclude kubernetes\.io\/docs
            --exclude '.*\{.*'
            --exclude '.*%7B.*'
            --exclude localhost
            --exclude 127\.0\.0\.1
            --exclude 'http://localhost:[0-9]+.*'
            --exclude 'https://localhost:[0-9]+.*'
            --exclude access\.redhat\.com
            --exclude docs\.redhat\.com
            --exclude blogs\.oracle\.com
            --exclude bugs\.mysql\.com
            --exclude forums\.mysql\.com
            --exclude www\.mysql\.com
            --exclude en\.opensuse\.org
            --exclude www\.cyberciti\.biz
            --exclude linux\.die\.net
            --exclude mariadb\.org\/feedback_plugin
            --exclude r\.mariadb\.com
            --exclude security-certs\.docs\.ubuntu\.com
            --exclude www\.linux-pam\.org
            --exclude www\.bzip\.org
            --exclude selinuxproject\.org
            --exclude www\.gnu\.org
            --exclude manpages\.ubuntu\.com
            --exclude packages\.ubuntu\.com
            --exclude www\.canonware\.com
            --exclude www\.npmjs\.com
            --exclude npmjs\.org
            --exclude mcs1
            --exclude s\.petrunia\.net
            --exclude mysql\.taobao\.org
            --exclude www\.shannon-sys\.com
            --exclude www\.hashicorp\.com
            --exclude blogspot\.com
            --exclude docs\.ansible\.com
            --exclude www\.poliarch\.org
            --exclude www\.reddit\.com
            --exclude csm\.mariadb\.com
            --exclude stackoverflow\.com
            --exclude gitlab\.kitware\.com
            --exclude www\.freedesktop\.org
            --exclude 'lists\.freedesktop\.org'
            --exclude azuremarketplace\.microsoft\.com
            --exclude console\.cloud\.google\.com
            --exclude partedmagic\.com
            --exclude 'github\.com/codership/(galera|mysql-wsrep)/issues/'
            --exclude 'github\.com/MariaDB/mariadb-docker/'
            --exclude 'github\.com/MariaDB/mariadb_kernel/'
            --exclude 'github\.com/mysql/mysql-utilities/'
            --exclude 'github\.com/Perl/perl5/issues/'
            --exclude 'www\.fsf\.org'
            --exclude 'dba\.stackexchange\.com'
            --exclude 'askubuntu\.com'
            --exclude 'valentina-db\.com'
            --exclude 'docs\.moodle\.org'
            --exclude 'www\.sqlmaestro\.com'
            ${{ steps.list.outputs.files }}
          fail: true
          # Don't error when the changed files contain no links to check. lychee
          # otherwise exits non-zero with "No links were found", which is a false
          # failure for link-free pages (e.g. nav stubs). See DOCS-6272.
          failIfEmpty: false

      - name: 📖 Help & Documentation
        if: failure()
        run: |
          echo "### ❌ Link Check Failed?" >> $GITHUB_STEP_SUMMARY
          echo "👉 [**Read the SOP: How to Fix Link Errors**](https://mariadbcorp.atlassian.net/wiki/spaces/DOCS/pages/3284140040/Pull+Requests#Method-1%3A-The-%22Quick-Fix%22-(Recommended))" >> $GITHUB_STEP_SUMMARY

