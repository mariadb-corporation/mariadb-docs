name: Check Links in PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        # SHA-pinned rather than tag-pinned: this action was compromised in
        # March 2025 (CVE-2025-30066), when tags in the v1-v45 range were
        # repointed at code that leaked runner secrets. Pinning the commit
        # removes the retag vector. Dependabot keeps the SHA and the comment
        # in sync. See DOCS-6362.
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # JSON output preserves path boundaries. The default space-separated
          # form escapes parentheses but NOT spaces, so a filename like
          # "most-recent-12.0 (1).md" splits into two bogus inputs and lychee
          # aborts with "Cannot parse inputs from arguments" before checking
          # anything. See DOCS-6361.
          json: true
          escape_json: false
          # safe_output backslash-escapes shell metacharacters inside the JSON
          # strings, which makes the JSON itself invalid ("\(" is not a legal
          # JSON escape) and jq refuses to parse it. We do our own quoting in
          # the next step instead, and pass the JSON via env rather than
          # interpolating it into the script, so filenames cannot inject shell.
          safe_output: false
          files: |
            **.md
            **.html
          # agent-skills/topical/ is vendored verbatim from MariaDB/skills
          # (see agent-skills/topical/VENDORED.md). Link fixes go upstream, not
          # here. Our own authored skills under agent-skills/granular/ stay in scope.
          files_ignore: |
            agent-skills/topical/**

      - name: Build a shell-safe file list
        id: list
        if: steps.changes.outputs.any_changed == 'true'
        env:
          CHANGED_JSON: ${{ steps.changes.outputs.all_changed_files }}
        run: |
          # jq's @sh emits each path as a single-quoted shell token, so paths
          # containing spaces survive word splitting in the args string below.
          {
            printf 'files='
            jq -r '.[] | @sh' <<< "$CHANGED_JSON" | tr '\n' ' '
            printf '\n'
          } >> "$GITHUB_OUTPUT"

      - name: Scan for broken links
        if: steps.changes.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # ADDED: Excludes for both raw '{' and encoded '%7B'
          # Flaky/example external hosts (bottom of the list): mcs1 is a
          # placeholder hostname in ColumnStore cmapi curl samples; the rest
          # time out, rate-limit (429), or return cert errors from CI but are
          # otherwise valid links. The newest two are from DOCS-6361:
          # blogspot.com answers CI with 429, and www.poliarch.org times out
          # from the runners; both serve 200 promptly from a normal client.
          #
          # Note for editors: the args block below is a YAML folded scalar, so
          # a '#' line inside it is NOT a comment -- it would be passed to
          # lychee as arguments. Document new excludes up here.
          args: >-
            --no-progress
            --exclude dev\.mysql\.com
            --exclude docs\.oracle\.com
            --exclude kubernetes\.io\/docs
            --exclude '.*\{.*'
            --exclude '.*%7B.*'
            --exclude localhost
            --exclude 127\.0\.0\.1
            --exclude 'http://localhost:[0-9]+.*'
            --exclude 'https://localhost:[0-9]+.*'
            --exclude access\.redhat\.com
            --exclude docs\.redhat\.com
            --exclude blogs\.oracle\.com
            --exclude bugs\.mysql\.com
            --exclude forums\.mysql\.com
            --exclude www\.mysql\.com
            --exclude en\.opensuse\.org
            --exclude www\.cyberciti\.biz
            --exclude linux\.die\.net
            --exclude mariadb\.org\/feedback_plugin
            --exclude r\.mariadb\.com
            --exclude security-certs\.docs\.ubuntu\.com
            --exclude www\.linux-pam\.org
            --exclude www\.bzip\.org
            --exclude selinuxproject\.org
            --exclude www\.gnu\.org
            --exclude manpages\.ubuntu\.com
            --exclude packages\.ubuntu\.com
            --exclude www\.canonware\.com
            --exclude www\.npmjs\.com
            --exclude npmjs\.org
            --exclude mcs1
            --exclude s\.petrunia\.net
            --exclude mysql\.taobao\.org
            --exclude www\.shannon-sys\.com
            --exclude www\.hashicorp\.com
            --exclude blogspot\.com
            --exclude www\.poliarch\.org
            ${{ steps.list.outputs.files }}
          fail: true
          # Don't error when the changed files contain no links to check. lychee
          # otherwise exits non-zero with "No links were found", which is a false
          # failure for link-free pages (e.g. nav stubs). See DOCS-6272.
          failIfEmpty: false

      - name: 📖 Help & Documentation
        if: failure()
        run: |
          echo "### ❌ Link Check Failed?" >> $GITHUB_STEP_SUMMARY
          echo "👉 [**Read the SOP: How to Fix Link Errors**](https://mariadbcorp.atlassian.net/wiki/spaces/DOCS/pages/3284140040/Pull+Requests#Method-1%3A-The-%22Quick-Fix%22-(Recommended))" >> $GITHUB_STEP_SUMMARY

