name: Announce release notes

# Posts each newly published release note, for every product in the Release Notes space, to
# #mariadb-product-releases, the company-wide channel where PMs announce releases. Requested by
# Adam Luciano: first for MariaDB Cloud (DOCS-6936), then for the whole portfolio (DOCS-7076).
# One message per note: the H1 in bold (it names the product and version), the note's own
# `description:`, and the live link.
#
# "Newly published" is decided by .github/scripts/release_announce.py, whose header explains
# what counts as a release note and why it is not "newly added": notes are merged hidden and
# unhidden when the release ships, often in a later push and often from the GitBook app. A
# GitBook-app commit reaches main as a normal push, so it triggers this workflow like any other.
#
# The script also holds back notes that are published but are not news: a stated release date
# older than MAX_AGE_DAYS (a backfill), or more than MAX_NOTES notes in one push (a migration).
# Those are listed in the run summary and reported to #docs-notifications, never posted.
#
# It runs per push rather than nightly because the post is the announcement: a release made
# public in the morning should not reach the company the next day.
#
# WHAT IT DOES NOT DO
#   - Remember what it announced. Nothing is stored; a note announces on the push that publishes
#     it. So a note that is hidden again and later unhidden is announced twice, and re-running a
#     failed run re-posts any note that run already posted before it failed.
#   - Post before the page is live. Each URL must answer 200 first. A note unhidden in place is
#     already served (GitBook serves hidden pages by direct URL), so that wait is immediate; a
#     brand-new note waits for the GitBook sync, up to WAIT_MINUTES, then the run fails rather
#     than post a dead link.
#
# The webhook is SLACK_PRODUCT_RELEASES_WEBHOOK_URL. Failures are reported to
# #docs-notifications via NOTIFICATIONS_WEBHOOK_URL, like every other workflow here; the
# company channel only ever receives announcements.
#
# workflow_dispatch replays any range as a dry run (the default), which prints the messages to
# the run summary and posts nothing. `before` and `after` must be full SHAs or branch names --
# GitHub does not serve fetches by abbreviated SHA.

on:
  push:
    branches: [main]
    paths:
      # Any note, any product; adding a page to the navigation (SUMMARY.md) or unhiding its
      # parent publishes it too. The script reads the whole space in one git process, so a push
      # that publishes nothing costs a few seconds.
      - 'release-notes/**'
      - '!release-notes/.gitbook/**'
  workflow_dispatch:
    inputs:
      before:
        description: 'Commit before the range (full SHA or branch name)'
        required: true
        type: string
      after:
        description: 'Commit at the end of the range (full SHA or branch name)'
        required: true
        default: main
        type: string
      post:
        description: 'Really post to #mariadb-product-releases (otherwise a dry run)'
        required: false
        default: false
        type: boolean
      max_notes:
        description: 'Most notes one run may announce; raise it to post a held-back batch'
        required: false
        default: '10'
        type: string
      max_age_days:
        description: 'Hold back notes whose stated release date is older than this; raise it to post a late note'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

# Queued, never cancelled: two quick pushes must both announce what they published.
concurrency:
  group: announce-release-notes
  cancel-in-progress: false

jobs:
  announce:
    # Upstream only: forks must not open bot PRs, post to Slack or publish (DOCS-6934).
    if: github.repository == 'mariadb-corporation/mariadb-docs'
    runs-on: ubuntu-latest
    # The live-URL wait is the long part (WAIT_MINUTES); the rest takes seconds.
    timeout-minutes: 40
    env:
      WAIT_MINUTES: '30'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the range
        id: range
        env:
          # Via env, never interpolated into the script (DOCS-6361).
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          IN_BEFORE: ${{ inputs.before }}
          IN_AFTER: ${{ inputs.after }}
          IN_POST: ${{ inputs.post }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            before=$PUSH_BEFORE after=$PUSH_AFTER post=true
          else
            before=$IN_BEFORE after=$IN_AFTER post=$IN_POST
          fi
          # A push that creates the branch has no "before". main always exists, so this only
          # guards against an unexpected payload; announcing every note ever published would be
          # the wrong default.
          if [[ "$before" =~ ^0+$ ]]; then
            echo "::error::No previous commit for this push ($before); refusing to guess a range."
            exit 1
          fi
          # Shallow fetch of just the two ends, into refs of their own so a SHA and a branch name
          # resolve the same way. The script reads both with `git show`, which needs the two
          # commits but not the history between them.
          git fetch --no-tags --depth=1 origin \
            "+$before:refs/announce/before" "+$after:refs/announce/after"
          before=$(git rev-parse refs/announce/before)
          after=$(git rev-parse refs/announce/after)
          {
            echo "before=$before"
            echo "after=$after"
            echo "post=$post"
          } >> "$GITHUB_OUTPUT"

      - name: Find newly published release notes
        id: find
        env:
          BEFORE: ${{ steps.range.outputs.before }}
          AFTER: ${{ steps.range.outputs.after }}
          # Via env, never interpolated into the script (DOCS-6361). Empty on push → default.
          MAX_NOTES: ${{ inputs.max_notes }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          set -euo pipefail
          # The script compares commit dates, so it needs the AFTER commit's metadata: the
          # shallow fetch above has it.
          python3 .github/scripts/release_announce.py "$BEFORE" "$AFTER" > result.json
          jq '.announce' result.json > notes.json
          jq '.skipped' result.json > skipped.json
          {
            echo "count=$(jq 'length' notes.json)"
            echo "skipped=$(jq 'length' skipped.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the Slack messages
        if: steps.find.outputs.count != '0'
        run: |
          set -euo pipefail
          # jq builds each payload, so quotes and backslashes cannot break the JSON. Slack reads
          # `text` as mrkdwn, where `<`, `>` and `&` are markup, and the title and description
          # can be edited by anyone with GitBook access -- so they are escaped. The link text is
          # the URL without its scheme, as in the 2026-10-01 post.
          mkdir -p payloads
          jq -c '.[]' notes.json | nl -nrz -w3 | while read -r i note; do
            jq -n --argjson n "$note" '
              def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              def collapse: gsub("\\s+"; " ");
              { text: ("*" + ($n.title | collapse | esc) + "*\n"
                       + ($n.description | collapse | esc) + "\n"
                       + "<" + $n.url + "|" + ($n.url | sub("^https://"; "")) + ">"),
                unfurl_links: false }' > "payloads/$i.json"
            jq -e . "payloads/$i.json" > /dev/null
          done

      - name: Wait until every page is live
        if: steps.find.outputs.count != '0'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          jq -r '.[].url' notes.json | while read -r url; do
            until [[ "$(curl -s -o /dev/null -w '%{http_code}' -L "$url")" == 200 ]]; do
              if (( $(date +%s) >= deadline )); then
                echo "::error::$url did not answer 200 within $WAIT_MINUTES minutes; nothing was posted."
                exit 1
              fi
              sleep 30
            done
            echo "Live: $url"
          done

      - name: Post to #mariadb-product-releases
        if: steps.find.outputs.count != '0' && steps.range.outputs.post == 'true'
        env:
          WEBHOOK: ${{ secrets.SLACK_PRODUCT_RELEASES_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK" ]]; then
            echo "::error::SLACK_PRODUCT_RELEASES_WEBHOOK_URL is not set."
            exit 1
          fi
          # curl rather than slackapi/slack-github-action because the number of messages varies.
          # --fail-with-body turns a revoked webhook, an archived channel or a 429 into a red run
          # with Slack's reason in the log, the job errors: true does for the action elsewhere.
          for p in payloads/*.json; do
            curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
              --data @"$p" "$WEBHOOK"
            echo
          done

      - name: Record the result in the run summary
        if: always()
        env:
          BEFORE: ${{ steps.range.outputs.before }}
          AFTER: ${{ steps.range.outputs.after }}
          POST: ${{ steps.range.outputs.post }}
        run: |
          set -euo pipefail
          {
            echo "## Release-note announcements"
            echo
            echo "Range: \`${BEFORE:-?}\`..\`${AFTER:-?}\`, posting: ${POST:-?}"
            echo
            if [[ ! -s notes.json ]]; then
              echo "No result -- an earlier step failed."
            elif [[ "$(jq 'length' notes.json)" == 0 ]]; then
              echo "No release note to announce in this range."
            else
              # Fenced: the text comes from page content, and this summary renders GFM.
              for p in payloads/*.json; do
                echo '````text'
                jq -r '.text' "$p"
                echo '````'
              done
            fi
            if [[ -s skipped.json && "$(jq 'length' skipped.json)" != 0 ]]; then
              echo
              echo "### Published but not announced"
              echo
              echo '````text'
              jq -r '.[] | "\(.file): \(.reason)"' skipped.json
              echo '````'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report held-back notes to #docs-notifications
        # Not a failure: a migration or backfill is expected to land here. But a real release
        # with a wrong date would too, so someone on the docs team has to see the list.
        if: steps.find.outputs.skipped != '0' && steps.find.outputs.skipped != '' && steps.range.outputs.post == 'true'
        env:
          WEBHOOK: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # jq builds the payload; file paths and reasons come from the repo, escaped for mrkdwn.
          jq -n --slurpfile s skipped.json --arg run "$RUN_URL" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            ($s[0] | length) as $n
            | { text: (":mute: *\($n) newly published release note(s) not announced* to #mariadb-product-releases. "
                       + "If any is a real new release, replay the same range from the workflow with post on and a higher max_notes or max_age_days.\n"
                       + ([$s[0][:15][] | "• `\(.file | esc)`: \(.reason | esc)"] | join("\n"))
                       + (if $n > 15 then "\n• … and \($n - 15) more" else "" end)
                       + "\n*Run:* " + $run),
                unfurl_links: false }' > held.json
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data @held.json "$WEBHOOK"

      - name: Notify #docs-notifications on failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.5
        with:
          webhook: ${{ secrets.NOTIFICATIONS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Release-note announcement failed* -- check whether it posted to #mariadb-product-releases before re-running.\n*Repo:* ${{ github.repository }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          errors: true
